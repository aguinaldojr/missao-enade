<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 720 360" role="img" aria-labelledby="title description">
  <title id="title">Limite de memória do serviço de miniaturas</title>
  <desc id="description">O limite do serviço é oito unidades. Seis estão ocupadas, restam duas e a próxima tarefa precisa de três. O computador possui doze unidades livres fora desse limite.</desc>
  <rect width="720" height="360" rx="24" fill="#fbf8ef"/>
  <text x="42" y="46" fill="#0b2b36" font-family="Arial, sans-serif" font-size="22" font-weight="700">Serviço de miniaturas - limite de 8 unidades</text>
  <g transform="translate(44 86)">
    <rect width="552" height="92" rx="14" fill="#d9f2ea" stroke="#008c72" stroke-width="3"/>
    <rect width="414" height="92" rx="12" fill="#008c72"/>
    <line x1="69" y1="0" x2="69" y2="92" stroke="#fbf8ef"/><line x1="138" y1="0" x2="138" y2="92" stroke="#fbf8ef"/>
    <line x1="207" y1="0" x2="207" y2="92" stroke="#fbf8ef"/><line x1="276" y1="0" x2="276" y2="92" stroke="#fbf8ef"/>
    <line x1="345" y1="0" x2="345" y2="92" stroke="#fbf8ef"/><line x1="414" y1="0" x2="414" y2="92" stroke="#0b2b36" stroke-width="3"/>
    <line x1="483" y1="0" x2="483" y2="92" stroke="#0b2b36"/>
    <text x="207" y="54" fill="#ffffff" font-family="Arial, sans-serif" font-size="21" font-weight="700" text-anchor="middle">6 ocupadas</text>
    <text x="483" y="54" fill="#0b2b36" font-family="Arial, sans-serif" font-size="19" font-weight="700" text-anchor="middle">2 livres</text>
  </g>
  <g font-family="Arial, sans-serif">
    <rect x="44" y="218" width="288" height="76" rx="12" fill="#fff3d6" stroke="#a66b12" stroke-width="2"/>
    <text x="64" y="248" fill="#0b2b36" font-size="17" font-weight="700">Próxima tarefa</text>
    <text x="64" y="276" fill="#405d63" font-size="16">precisa reservar 3 unidades</text>
    <rect x="364" y="218" width="312" height="76" rx="12" fill="#e7eef0" stroke="#405d63" stroke-width="2"/>
    <text x="384" y="248" fill="#0b2b36" font-size="17" font-weight="700">Computador</text>
    <text x="384" y="276" fill="#405d63" font-size="16">12 unidades livres fora do limite</text>
  </g>
  <text x="44" y="330" fill="#8a5a12" font-family="Arial, sans-serif" font-size="16">2 disponíveis no serviço não comportam a reserva de 3.</text>
</svg>
