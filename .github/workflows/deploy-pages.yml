name: Publicar teste no GitHub Pages

on:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Obter o código
        uses: actions/checkout@v7

      - name: Configurar Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Instalar dependências bloqueadas
        run: npm ci

      - name: Executar lint
        run: npm run lint

      - name: Executar testes
        run: npm test

      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5

      - name: Compilar para o subdiretório do repositório
        env:
          VITE_BASE_PATH: /${{ github.event.repository.name }}/
          VITE_RANKING_API_URL: ${{ vars.VITE_RANKING_API_URL }}
          VITE_STUDENT_REGISTRY_API_URL: ${{ vars.VITE_STUDENT_REGISTRY_API_URL }}
        run: npm run build

      - name: Enviar artefato estático
        uses: actions/upload-pages-artifact@v4
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Publicar no GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
